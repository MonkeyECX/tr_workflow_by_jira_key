name: 'Jira Linked Workflow Dispatcher'
description: 'Find repositories in a GitHub organization by Jira key and optionally dispatch workflows'
inputs:
  github_token:
    description: 'Github Token'
    required: true
  commit_sha:
    description: 'Github commit sha'
    required: true
  workflow_id:
    description: 'Github workflow name'
    required: false
  actual_repository:
    description: 'Github repository name'
    required: true
  trigger_workflow:
    description: 'Trigger workflow'
    required: true
outputs:
  message:
    description: 'The output message'
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
